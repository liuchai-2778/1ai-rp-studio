<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content"/>
<meta name="theme-color" content="#131314"/>
<title>RP Studio</title>
<style>
:root{--bg:#131314;--sf:#1e1f20;--el:#282a2c;--gl:rgba(30,31,32,0.85);--bd:rgba(255,255,255,0.1);--bds:rgba(255,255,255,0.18);--tx:#e3e3e3;--sub:#9aa0a6;--ac:#a8c7fa;--acb:rgba(168,199,250,0.15);--dg:#f28b82;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;height:100dvh;overflow:hidden;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-size:15px;line-height:1.6;overscroll-behavior:none}
#app{display:flex;flex-direction:column;width:100%;height:100%;max-width:820px;margin:0 auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.glass{background:var(--gl);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--bd)}
.top{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;margin:8px 10px 0;border-radius:999px;flex-shrink:0}
.top-l{display:flex;align-items:center;gap:8px;min-width:0;flex:1}.top-l>div{min-width:0}
.menu-btn{background:none;border:none;color:var(--tx);font-size:18px;cursor:pointer;padding:2px 6px}
.r-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-sub{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.navs{display:flex;gap:2px;flex-shrink:0}
.nbtn{background:none;border:none;color:var(--sub);padding:5px 10px;border-radius:999px;font-size:13px;cursor:pointer}
.nbtn:active{background:rgba(255,255,255,0.08);color:var(--tx)}
#chat{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.divd{text-align:center;font-size:11px;color:var(--sub);padding:4px 0;border-bottom:1px dashed var(--bd)}
.row{display:flex;gap:10px;align-items:flex-start}
.row.in{animation:in .3s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.row.arch{opacity:0.45}
.row.user{flex-direction:row-reverse}
.row.nar{justify-content:center}
.av{width:34px;height:34px;border-radius:50%;background:var(--el);border:1px solid var(--bds);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--ac);flex-shrink:0}
.mmain{max-width:calc(100% - 46px);display:flex;flex-direction:column;gap:4px}
.row.user .mmain{align-items:flex-end;max-width:82%}
.row.nar .mmain{max-width:96%;width:100%}
.msend{font-size:12px;color:var(--sub);padding:0 4px}
.bub{padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.65;word-break:break-word;white-space:pre-wrap;background:var(--sf);border:1px solid var(--bd)}
.row.char .bub{border-top-left-radius:5px}
.row.user .bub{background:#2b2d30;border-color:var(--bds);border-top-right-radius:5px}
.row.nar .bub{background:rgba(38,40,44,0.55);border-radius:12px;color:#c4c7c5;font-size:14px}
.bub em{color:var(--sub);font-style:italic}
.macts{display:none;gap:4px;padding:2px 0 0;flex-wrap:wrap}
.mmain.open .macts{display:flex;animation:in .2s var(--ease)}
.abtn{background:none;border:none;color:var(--sub);font-size:12.5px;cursor:pointer;padding:6px 8px}
.abtn:hover{color:var(--tx)}
.abtn.dg{color:var(--dg)}
.bot{padding:6px 10px 10px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.strip::-webkit-scrollbar{display:none}
.chip{padding:5px 13px;border-radius:999px;font-size:12.5px;color:var(--sub);background:var(--sf);border:1px solid var(--bd);cursor:pointer;white-space:nowrap}
.chip.on{color:#0b121e;background:var(--ac);border-color:var(--ac);font-weight:600}
.chip.gh{color:var(--ac);background:var(--acb)}
.ibox{display:flex;align-items:flex-end;gap:8px;padding:8px 10px 8px 16px;border-radius:26px}
#uin{flex:1;background:none;border:none;outline:none;color:var(--tx);font-size:16px;line-height:1.5;max-height:100px;min-height:24px;resize:none;font-family:inherit}
.sbtn{width:36px;height:36px;border-radius:50%;border:none;background:var(--ac);color:#0b121e;font-weight:700;cursor:pointer;flex-shrink:0}
.sbtn.stop{background:var(--dg)}
.btn,.chip,.nbtn,.sbtn{transition:transform .15s,background .2s,color .2s}
.btn:active,.chip:active,.sbtn:active{transform:scale(.94)}
.mask{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,0.6);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;display:flex;align-items:center;justify-content:center;padding:12px}
.mask.show{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(84%,320px);z-index:98;background:#18191b;border-right:1px solid var(--bds);transform:translateX(-100%);transition:transform .3s var(--ease);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 14px 14px;gap:10px;will-change:transform}
.drawer.show{transform:none}
.mcard{width:100%;max-width:520px;max-height:85dvh;background:#18191b;border:1px solid var(--bds);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;transform:translateY(30px) scale(.97);transition:transform .3s var(--ease)}
.mask.show .mcard{transform:none}
.mhead{padding:13px 16px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;font-weight:600}
.mbody{padding:14px 16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12px;color:var(--sub)}
.inp,.ta{width:100%;background:var(--sf);border:1px solid var(--bds);border-radius:10px;padding:9px 11px;color:var(--tx);font-size:16px;font-family:inherit;outline:none}
.ta{min-height:76px;resize:vertical}
.brow{display:flex;flex-wrap:wrap;gap:8px}
.btn{background:var(--el);border:1px solid var(--bds);color:var(--tx);padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer}
.btn.pri{background:var(--ac);color:#0b121e;border-color:var(--ac);font-weight:600}
.btn.dg{color:var(--dg);border-color:rgba(242,139,130,0.3)}
.citem{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}
.sitem{padding:10px 12px;border-radius:10px;background:var(--sf);border:1px solid var(--bd);cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background .2s,border-color .2s}
.sitem.act{border-color:var(--ac);background:var(--acb)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:#303134;border:1px solid var(--bds);padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--ease);z-index:200;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){.mask{align-items:flex-end;padding:0}.mcard{max-width:none;border-radius:22px 22px 0 0;max-height:90dvh;transform:translateY(100%);padding-bottom:env(safe-area-inset-bottom)}.nbtn{padding:6px 7px;font-size:12.5px}.top{margin:6px 8px 0;padding:7px 10px}}
.dots{display:inline-flex;gap:5px;padding:5px 0}.dots i{width:7px;height:7px;border-radius:50%;background:var(--ac);animation:bn 1.1s infinite ease-in-out}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bn{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-6px);opacity:1}}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.ent{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
@media(prefers-reduced-motion:reduce){.row,.macts,.mcard,.drawer,.mask,#toast{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top glass">
    <div class="top-l">
      <button class="menu-btn" type="button" onclick="toggleDrawer(true)">≡</button>
      <div><div class="r-title" id="rt">加载中</div><div class="r-sub" id="rs"></div></div>
    </div>
    <nav class="navs">
      <button class="nbtn" type="button" onclick="openM('m-char')">角色</button>
      <button class="nbtn" type="button" onclick="openM('m-world')">世界</button>
      <button class="nbtn" type="button" onclick="openM('m-mem')">记忆</button>
      <button class="nbtn" type="button" onclick="openM('m-set')">设置</button>
    </nav>
  </header>
  <main id="chat"></main>
  <footer class="bot">
    <div class="strip" id="strip"></div>
    <div class="ibox glass">
      <textarea id="uin" rows="1" placeholder="输入对话或行动（*星号* 表示动作神态）"></textarea>
      <button class="sbtn" type="button" id="sbtn" onclick="sendOrStop()">↑</button>
    </div>
  </footer>
</div>

<div class="drawer" id="drawer">
  <div style="font-weight:600;display:flex;justify-content:space-between;align-items:center"><span>会话存档列表</span><button class="abtn" onclick="toggleDrawer(false)">✕</button></div>
  <button class="btn pri" type="button" onclick="newChatModal()">＋ 新建对话 (1v1 或 群聊)</button>
  <div id="slist" style="display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1"></div>
</div>
<div class="mask" id="d-mask" onclick="toggleDrawer(false)" style="z-index:97"></div>

<div class="mask" id="m-newchat"><div class="mcard">
  <div class="mhead"><span>创建新对话</span><button class="abtn" onclick="closeM('m-newchat')">取消</button></div>
  <div class="mbody">
    <div class="fld"><label>对话标题 / 存档名</label><input class="inp" id="nc-title" placeholder="例如：与凯尔的荒原夜话"/></div>
    <div class="fld"><label>对话模式</label>
      <select class="inp" id="nc-mode">
        <option value="1v1">1v1 纯享私聊（只与指定角色单聊）</option>
        <option value="group">群聊 / 文游剧场（多人点名与旁白）</option>
      </select>
    </div>
    <div class="fld"><label>选择主要交流角色</label><select class="inp" id="nc-char"></select></div>
    <button class="btn pri" type="button" onclick="createChatCommit()">立即开启新旅程</button>
  </div>
</div></div>

<div id="toast"></div>

<div class="mask" id="m-char"><div class="mcard">
  <div class="mhead"><span>角色管理</span><button class="abtn" onclick="closeM('m-char')">关闭</button></div>
  <div class="mbody">
    <div class="brow">
      <button class="btn pri" onclick="editC(null)">新建角色</button>
      <button class="btn" onclick="$('cf').click()">导入 JSON/TXT</button>
      <input type="file" id="cf" accept=".json,.txt,.md,.png" multiple style="display:none" onchange="impC(event)"/>
    </div>
    <div id="ced" style="display:none;flex-direction:column;gap:8px;padding:10px;background:var(--bg);border-radius:12px;border:1px solid var(--bds)">
      <input type="hidden" id="cid"/>
      <div class="fld"><label>名称</label><input class="inp" id="cname"/></div><div class="fld"><label>头像（emoji 或上传图片）</label><div class="brow"><input class="inp" id="cav" style="flex:1" oninput="$('cavd').value=''"/><input type="hidden" id="cavd"/><button class="btn" onclick="$('caf').click()">上传</button><input type="file" id="caf" accept="image/*" style="display:none" onchange="upAv(event)"/></div></div>
      <div class="fld"><label>设定与性格 (description)</label><textarea class="ta" id="cdesc"></textarea></div>
      <div class="fld"><label>扮演指令 (system_prompt)</label><textarea class="ta" id="cprompt"></textarea></div>
      <div class="fld"><label>开场白 (first_mes)</label><textarea class="ta" id="cfirst"></textarea></div>
      <div class="brow"><button class="btn pri" onclick="saveC()">保存角色</button><button class="btn" onclick="$('ced').style.display='none'">取消</button></div>
    </div>
    <div id="clist" style="display:flex;flex-direction:column;gap:8px"></div>
  </div>
</div></div>

<div class="mask" id="m-world"><div class="mcard">
  <div class="mhead"><span>世界书</span><button class="abtn" onclick="closeM('m-world')">关闭</button></div>
  <div class="mbody">
    <div class="brow"><button class="btn" onclick="$('wf').click()">导入世界观 (.json/.txt)</button><input type="file" id="wf" accept=".json,.txt,.md" style="display:none" onchange="impW(event)"/></div>
    
    
    <div class="strip" id="wlist"></div><div class="fld"><label>世界书名称</label><input class="inp" id="wbname"/></div><label class="chk"><input type="checkbox" id="wbon"/>启用此世界书（所有对话生效，新对话也自动应用）</label><div class="fld"><label>世界观与文游规则</label><textarea class="ta" id="wglob"></textarea></div><div class="fld"><label>关键词词条（关键词用逗号分隔）</label><div id="wents" style="display:flex;flex-direction:column;gap:8px"></div></div><div class="brow"><button class="btn" onclick="addEnt()">＋ 词条</button><button class="btn dg" onclick="delWb()">删除此世界书</button></div>
    
    <button class="btn pri" onclick="saveW()">保存设定</button>
  </div>
</div></div>

<div class="mask" id="m-mem"><div class="mcard">
  <div class="mhead"><span>当前会话记忆摘要</span><button class="abtn" onclick="closeM('m-mem')">关闭</button></div>
  <div class="mbody">
    <div style="font-size:12px;color:var(--sub)" id="minfo"></div>
    <div class="brow">
      <button class="btn pri" id="cbtn" onclick="compress()">立即调用 AI 压缩早期对话</button>
      <button class="btn" onclick="unarch()">恢复全部归档</button>
    </div>
    <div class="fld"><label>保留最近条数</label><input class="inp" type="number" id="mkeep"/></div><div class="fld"><label>自动压缩：未归档超过多少条时触发（0 = 关闭）</label><input class="inp" type="number" id="mauto"/></div>
    <div class="fld"><label>当前存档前情提要 / 剧情摘要</label><textarea class="ta" id="msum" style="min-height:120px"></textarea></div>
    <button class="btn pri" onclick="saveM()">保存记忆设置</button>
  </div>
</div></div>

<div class="mask" id="m-set"><div class="mcard">
  <div class="mhead"><span>接口与全局设置</span><button class="abtn" onclick="saveSet()">完成</button></div>
  <div class="mbody">
    <div class="strip" id="plist"></div>
    <div class="fld"><label>接口名称</label><input class="inp" id="apname"/></div>
    <div class="brow">
      <button class="btn" onclick="preset('https://api.deepseek.com/v1','deepseek-chat')">DeepSeek V3</button>
      <button class="btn" onclick="preset('https://api.deepseek.com/v1','deepseek-reasoner')">DeepSeek R1</button>
      <button class="btn" onclick="preset('https://api.siliconflow.cn/v1','deepseek-ai/DeepSeek-V3')">硅基流动</button>
    </div>
    <div class="fld"><label>API Base URL</label><input class="inp" id="aurl"/></div>
    <div class="fld"><label>API Key</label><input class="inp" type="password" id="akey" placeholder="sk-..."/></div>
    <div class="fld"><label>Model</label><input class="inp" id="amodel"/></div>
    <div class="fld"><label>Temperature</label><input class="inp" type="number" step="0.05" id="atemp"/></div>
    <label class="chk"><input type="checkbox" id="afb"/>出错时自动尝试其他有 Key 的接口</label><div class="brow"><button class="btn dg" onclick="delProv()">删除此接口</button><button class="btn" onclick="exportAll()">导出存档</button><button class="btn" onclick="$('iaf').click()">导入存档</button><input type="file" id="iaf" accept=".json" style="display:none" onchange="impAll(event)"/><button class="btn dg" onclick="resetAll()">重置所有数据</button></div>
    <button class="btn pri" onclick="saveSet()">保存设置</button>
  </div>
</div></div>

<div class="mask" id="m-ed"><div class="mcard">
  <div class="mhead"><span id="ed-t">编辑消息</span><button class="abtn" onclick="closeM('m-ed')">取消</button></div>
  <div class="mbody">
    <textarea class="ta" id="ed-ta" style="min-height:140px"></textarea>
    <button class="btn pri" onclick="saveEd()">确认</button>
  </div>
</div></div>

<script>
var $=function(id){return document.getElementById(id)};
var DEF_CHARS=[
  {id:'c_kael',name:'凯尔',desc:'成年男性黑豹兽人，身高近两米，覆着紧实油亮的黑毛，肩背宽阔，体格极具爆发力与压迫感。暗金色竖瞳，左耳有一道旧伤缺口，黑豹长尾低垂摆动。前边境精锐斥候，现为独行佣兵。性格沉稳冷峻、寡言重诺，对认可的搭档极为护短。',prompt:'你扮演男性黑豹兽人「凯尔」。说话简练低沉，善于通过黑豹兽耳的转动、金色竖瞳的收缩、长尾的摆动或喉咙低吼展现情绪变化。神态动作请放在 *星号* 之间。',first:'*篝火噼啪作响，高大的黑豹兽人坐在阴影与火光的交界处，正用鹿皮慢条斯理地擦拭着战术直刀。听到脚步声，他那只带着旧伤缺口的黑色兽耳微微一动，暗金色的竖瞳抬起看向你，身后的长尾在地面上轻轻扫过* 醒了？守夜算我的，把水囊拿去，半小时后出发。',inRoom:true},
  {id:'c_nar',name:'旁白',desc:'负责客观推进文游剧情、描绘环境氛围、判定行动结果以及扮演其它NPC的叙事者。',prompt:'你是文游的客观旁白与DM。请用克制、有画面感的笔触描绘场景与剧情发展，绝不代替玩家说话或做决定。',first:'夜色笼罩着荒原边缘的旧营地，冷风掠过枯草，远处的山脊在月光下显出沉默的轮廓。',inRoom:true}
];
var DEF_S={
  provs:[{id:'p1',name:'DeepSeek',url:'https://api.deepseek.com/v1',key:'',model:'deepseek-chat',temp:0.85}],curProv:'p1',
  user:{name:'搭档',persona:'与凯尔同行的搭档，正在共同执行横跨荒原的委托。'},
  world:{globalPrompt:'硬派奇幻冒险世界，注重环境氛围与兽人动作细节描写。',entries:[]},
  chars:DEF_CHARS,
  chats:[{id:'chat_1',title:'与凯尔的荒原私聊',mode:'1v1',targetId:'c_kael',mem:{sum:'',keep:10},msgs:[{role:'char',sid:'c_kael',sname:'凯尔',txt:DEF_CHARS[0].first,arch:false}]}],
  curChatId:'chat_1'
};
var S=(function(){try{var r=localStorage.getItem('RPS_V6');return r?Object.assign({},JSON.parse(JSON.stringify(DEF_S)),JSON.parse(r)):JSON.parse(JSON.stringify(DEF_S))}catch(e){return JSON.parse(JSON.stringify(DEF_S))}})(),busy=false,ac=null,edM={i:-1},seen=new WeakSet(),lastN=-1,lastId='';
if(S.api){S.provs=[Object.assign({id:'p1',name:'DeepSeek'},S.api)];S.curProv='p1';delete S.api}
if(!S.wbs){S.wbs=[{id:'w1',name:'默认世界书',prompt:S.world.globalPrompt||'',entries:(S.world.entries||[]).map(function(e){return {keys:e.keys||[],content:e.content||'',on:true,con:false}})}]}
S.wbs.forEach(function(w){if(w.on===undefined)w.on=S.chats.some(function(c){return (c.wb||[]).indexOf(w.id)>=0})||S.wbs.length===1});var curWb=(S.wbs.find(function(w){return w.on})||S.wbs[0]).id,stopAll=false;
function P(){return S.provs.find(function(p){return p.id===S.curProv})||S.provs[0]}
function save(){try{localStorage.setItem('RPS_V6',JSON.stringify(S))}catch(e){}}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e.t);e.t=setTimeout(function(){e.classList.remove('show')},2400)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function mac(s,cn){return String(s||'').replace(/\{\{user\}\}/gi,S.user.name||'搭档').replace(/\{\{char\}\}/gi,cn||'角色')}
function fmt(t,sn){if(t==='...')return '<span class="dots"><i></i><i></i><i></i></span>';return esc(mac(t,sn)).replace(/\*([^*]+)\*/g,'<em>*$1*</em>')}
function ep(p){var u=p.url.replace(/\/+$/,'');return u.indexOf('/chat/completions')<0?u+'/chat/completions':u}
function getC(id){return S.chars.find(function(c){return c.id===id})}
function getCurChat(){return S.chats.find(function(ch){return ch.id===S.curChatId})||S.chats[0]}

function render(){
  var ch=getCurChat();if(!ch)return;
  var box=$('chat'),keep=box.scrollTop;
  $('rt').textContent=ch.title;
  var actCnt=ch.msgs.filter(function(m){return !m.arch}).length;
  var tk=Math.round((ch.msgs.filter(function(m){return !m.arch}).reduce(function(a,m){return a+m.txt.length},0)+(ch.mem.sum||'').length)/1.5);$('rs').textContent=(ch.mem.sum?'摘要已启用 · ':'')+actCnt+' 条 ≈'+tk+' tk · '+P().name;

  var st=$('strip');st.innerHTML='';
  if(ch.mode==='group'){
    S.chars.filter(function(c){return c.inRoom}).forEach(function(c){
      var b=document.createElement('button');b.className='chip'+(c.id===ch.targetId?' on':'');b.textContent=c.name;
      b.onclick=function(){ch.targetId=c.id;save();render()};st.appendChild(b);
    });
    var b1=document.createElement('button');b1.className='chip gh';b1.textContent='让TA接话';b1.onclick=function(){reply(ch.targetId)};st.appendChild(b1);
    var b3=document.createElement('button');b3.className='chip gh';b3.textContent='全员轮流';b3.onclick=roundRobin;st.appendChild(b3);
    var b2=document.createElement('button');b2.className='chip';b2.textContent='+ 旁白';b2.onclick=function(){openEd(-1)};st.appendChild(b2);
  }else{
    var tc=getC(ch.targetId),sp=document.createElement('span');sp.style.cssText='font-size:12px;color:var(--sub);padding:4px 8px';
    sp.textContent='1v1 私聊：正与 '+(tc?tc.name:'未知')+' 对话';st.appendChild(sp);
  }

  box.innerHTML='';
  var dShown=false,hasA=ch.msgs.some(function(m){return m.arch});
  ch.msgs.forEach(function(m,i){
    if(hasA&&!m.arch&&!dShown&&i>0){dShown=true;var d=document.createElement('div');d.className='divd';d.textContent='以上对话已压缩至摘要，不再消耗 Token';box.appendChild(d)}
    var isN=m.role==='nar'||m.sname==='旁白',rt=m.role==='user'?'user':(isN?'nar':'char');
    var nw=!seen.has(m);seen.add(m);
    var row=document.createElement('div');row.className='row '+rt+(m.arch?' arch':'')+(nw&&lastN>=0&&i>=ch.msgs.length-2?' in':'');
    var sn=m.role==='user'?(S.user.name||'搭档'):(m.sname||'角色');
    var cc=getC(m.sid),ia=cc&&cc.av,av=rt==='nar'?'':'<div class="av">'+(ia&&ia.indexOf('data:')===0?'<img src="'+ia+'">':esc(ia||sn.slice(0,1)))+'</div>';
    row.innerHTML=av+'<div class="mmain"><div class="msend">'+esc(sn)+(m.arch?' · 已归档':'')+'</div>'+
      '<div class="bub">'+fmt(m.txt,sn)+'</div>'+
      '<div class="macts">'+(rt!=='user'?'<button class="abtn" onclick="reroll('+i+')">重生成</button>':'')+
      '<button class="abtn" onclick="openEd('+i+')">编辑</button><button class="abtn" onclick="rollbk('+i+')">回档</button><button class="abtn dg" onclick="delM('+i+')">删除</button></div></div>';
    box.appendChild(row);
  });
  if(ch.id!==lastId)box.scrollTop=box.scrollHeight;
  else if(ch.msgs.length>lastN&&lastN>=0)box.scrollTo({top:box.scrollHeight,behavior:'smooth'});
  else box.scrollTop=keep;
  lastId=ch.id;lastN=ch.msgs.length;
  renderDrawer();
}

function renderDrawer(){
  var sl=$('slist');sl.innerHTML='';
  S.chats.forEach(function(ch){
    var d=document.createElement('div');d.className='sitem'+(ch.id===S.curChatId?' act':'');
    d.innerHTML='<div><div style="font-weight:600;font-size:13.5px">'+esc(ch.title)+'</div><div style="font-size:11px;color:var(--sub)">'+(ch.mode==='1v1'?'1v1私聊':'群聊剧场')+'</div></div><button class="abtn dg" onclick="delChat(\''+ch.id+'\',event)">删除</button>';
    d.onclick=function(){S.curChatId=ch.id;save();render();toggleDrawer(false)};
    sl.appendChild(d);
  });
}

function delChat(id,e){

function sendOrStop(){
  if(busy){stopAll=true;if(ac)ac.abort();return}
  var v=$('uin').value.trim(),ch=getCurChat();
  if(!v){reply(ch.targetId||S.chars[0].id);return}
  $('uin').value='';$('uin').style.height='auto';
  ch.msgs.push({role:'user',sid:'user',sname:S.user.name||'搭档',txt:v,arch:false});
  save();render();reply(ch.targetId);
}

async function reply(cid){
  if(busy)return;
  var ch=getCurChat(),sp=getC(cid)||S.chars[0],p=P();
  if(!sp){openM('m-char');return}
  if(!p.key){openM('m-set');toast('请先填入 API Key');return}
  busy=true;ac=new AbortController();var out='';
  $('sbtn').classList.add('stop');$('sbtn').textContent='■';
  var tm={role:sp.name==='旁白'?'nar':'char',sid:sp.id,sname:sp.name,txt:'...',arch:false};
  ch.msgs.push(tm);render();
  try{
    var act=ch.msgs.slice(0,-1).filter(function(m){return !m.arch});
    var recent=act.slice(-6).map(function(m){return m.txt}).join('\n');
    var wbs=S.wbs.filter(function(w){return w.on}),lore=[].concat.apply([],wbs.map(function(w){return w.entries})).filter(function(en){return en.on!==false&&en.content&&(en.con||(en.keys||[]).some(function(k){return k&&recent.includes(k)}))}).map(function(en){return '['+(en.keys||[]).join('/')+']: '+en.content}).join('\n');
    var sys=[
      '[全局世界观]\n'+mac(wbs.map(function(w){return w.prompt}).filter(Boolean).join('\n\n'),sp.name),
      lore?('[触发世界书词条]\n'+lore):'',
      ch.mem.sum?('[前情提要摘要]\n'+mac(ch.mem.sum,sp.name)):'',
      '[玩家设定('+S.user.name+')]\n'+mac(S.user.persona,sp.name),
      '[你当前扮演的角色]\n名称：'+sp.name+'\n设定：'+mac(sp.desc,sp.name)+'\n指令：'+mac(sp.prompt,sp.name)+'\n严禁代替玩家发言。'
    ].filter(Boolean).join('\n\n');
    var turns=[];
    act.forEach(function(m){
      var r=(m.role!=='user'&&m.sid===sp.id)?'assistant':'user';
      var c=m.role==='user'?(S.user.name+'：'+m.txt):(r==='assistant'?m.txt:('['+m.sname+']：'+m.txt));
      if(turns.length&&turns[turns.length-1].role===r)turns[turns.length-1].content+='\n\n'+c;
      else turns.push({role:r,content:c});
    });
    if(!turns.length||turns[turns.length-1].role==='assistant')turns.push({role:'user',content:'[请继续以 '+sp.name+' 的身份回应]'});
    if(turns[0].role==='assistant')turns.unshift({role:'user',content:'[开始]'});

    var res,q,qi,qs=[p].concat(S.fb?S.provs.filter(function(x){return x!==p&&x.key}):[]);
    for(qi=0;qi<qs.length;qi++){q=qs[qi];try{res=await fetch(ep(q),{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+q.key.trim()},body:JSON.stringify({model:q.model||'deepseek-chat',messages:[{role:'system',content:sys}].concat(turns),temperature:Number(q.temp)||0.85,stream:true})});if(res.ok)break}catch(er){if(er.name==='AbortError'||qi===qs.length-1)throw er}}
    if(qi>0&&res.ok)toast('已改用接口：'+q.name);
    if(!res.ok){var et='';try{et=(await res.text()).slice(0,100)}catch(_){}throw new Error('HTTP '+res.status+' '+et)}
    var rd=res.body.getReader(),dc=new TextDecoder(),bf='',bx=$('chat'),bub=bx.lastElementChild.querySelector('.bub');
    for(;;){
      if(ac&&ac.signal.aborted){try{rd.cancel()}catch(_){}break}var rr=await rd.read();if(rr.done)break;
      bf+=dc.decode(rr.value,{stream:true});var ls=bf.split('\n');bf=ls.pop();
      for(var j=0;j<ls.length;j++){
        var l=ls[j].trim();if(l.indexOf('data:')!==0)continue;l=l.slice(5).trim();if(l==='[DONE]')continue;
        try{var dt=JSON.parse(l).choices[0].delta;
          if(dt&&dt.content){out+=dt.content;var near=bx.scrollHeight-bx.scrollTop-bx.clientHeight<80;bub.innerHTML=fmt(out,sp.name);if(near)bx.scrollTop=bx.scrollHeight}
        }catch(_){}
      }
    }
    if(!out.trim()){var ab=new Error('无内容');if(ac&&ac.signal.aborted)ab.name='AbortError';throw ab}
    tm.txt=out.trim();
  }catch(e){
    if(out.trim())tm.txt=out.trim();
    else{var ix=ch.msgs.indexOf(tm);if(ix>=0)ch.msgs.splice(ix,1);if(e.name!=='AbortError')toast('请求失败：'+e.message)}
  }finally{busy=false;ac=null;$('sbtn').classList.remove('stop');$('sbtn').textContent='↑';save();render();if(S.autoN>0&&ch.msgs.filter(function(m){return !m.arch}).length>S.autoN)compress()}
}

async function compress(){
  var p=P();if(!p.key){toast('请先设置 API Key');return}
  var ch=getCurChat(),keep=Math.max(2,$('m-mem').classList.contains('show')?parseInt($('mkeep').value,10)||10:ch.mem.keep||10),ua=[];
  ch.msgs.forEach(function(m,i){if(!m.arch)ua.push(i)});
  if(ua.length<=keep){toast('未归档消息不多，无需压缩');return}
  var tc=ua.slice(0,ua.length-keep),blk=tc.map(function(i){return ch.msgs[i].sname+'：'+ch.msgs[i].txt}).join('\n');
  $('cbtn').textContent='提炼中...';
  try{
    var res=await fetch(ep(p),{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+p.key.trim()},body:JSON.stringify({model:p.model,messages:[{role:'user',content:'请将以下前情与新增对话合并提炼为250字以内的文游剧情摘要：\n原摘要：'+(ch.mem.sum||'无')+'\n对话：\n'+blk}]})});
    var d=await res.json(),sum=d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content;
    if(sum){ch.mem.sum=sum.trim();tc.forEach(function(i){ch.msgs[i].arch=true});save();if($('m-mem').classList.contains('show'))openM('m-mem');render();toast('已压缩')}
    else toast('压缩失败，请检查接口')
  }catch(e){toast('失败：'+e.message)}finally{$('cbtn').textContent='立即调用 AI 压缩早期对话'}
}
function unarch(){var ch=getCurChat();ch.msgs.forEach(function(m){m.arch=false});save();openM('m-mem');render()}

function saveC(){
  var id=$('cid').value,n=$('cname').value.trim();if(!n)return;
  var d=$('cdesc').value.trim(),p=$('cprompt').value.trim(),f=$('cfirst').value.trim(),av=$('cavd').value||$('cav').value.trim();

  else S.chars.push({id:'c_'+Date.now(),name:n,desc:d,prompt:p,first:f,av:av,inRoom:true});

async function impC(e){
  var fs=Array.from(e.target.files||[]);e.target.value='';if(!fs.length)return;
  for(var i=0;i<fs.length;i++){
    var f=fs[i],bn=f.name.replace(/\.(json|txt|md|png)$/i,''),t=/\.png$/i.test(f.name)?await pngCard(f):await f.text();if(!t){toast('PNG 里没找到角色卡数据');continue}
    try{
      var j=JSON.parse(t),k=j.data||j;
      S.chars.push({id:'c_'+Date.now()+i,name:k.name||k.char_name||bn,desc:[k.description||'',k.personality||'',k.scenario||''].filter(Boolean).join('\n'),prompt:k.system_prompt||'',first:k.first_mes||'',inRoom:true});
    }catch(er){S.chars.push({id:'c_'+Date.now()+i,name:bn,desc:t,prompt:'',first:'',inRoom:true})}
  }
  save();rChars();render();
}
async function impW(e){var f=e.target.files[0];e.target.value='';if(!f)return;saveWb();var t=await f.text(),n={id:'w'+Date.now(),name:f.name.replace(/\.\w+$/,''),prompt:'',entries:[],on:true};
  try{var j=JSON.parse(t),es=j.entries||j;es=Array.isArray(es)?es:Object.keys(es).map(function(k){return es[k]});if(typeof j.prompt==='string')n.prompt=j.prompt;
    es.forEach(function(x){if(!x||!x.content)return;n.entries.push({keys:x.key||x.keys||[],content:x.content,on:x.disable!==true,con:!!x.constant})});
    if(!n.entries.length&&!n.prompt)throw 0}catch(er){n.prompt=t;n.entries=[]}
  S.wbs.push(n);curWb=n.id;save();loadWb();toast('已导入为新世界书（'+n.entries.length+' 条词条）')}
function saveW(){
  saveWb();
  
  save();render();closeM('m-world');
}

function upAv(e){var f=e.target.files[0];e.target.value='';if(!f)return;var im=new Image();im.onload=function(){var c=document.createElement('canvas');c.width=c.height=96;var s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,96,96);$('cavd').value=c.toDataURL('image/jpeg',.8);$('cav').value='✓已选图片'};im.src=URL.createObjectURL(f)}
async function pngCard(f){var b=new Uint8Array(await f.arrayBuffer()),dv=new DataView(b.buffer),p=8;while(p<b.length){var n=dv.getUint32(p),ty=String.fromCharCode(b[p+4],b[p+5],b[p+6],b[p+7]);if(ty==='tEXt'){var s=new TextDecoder('latin1').decode(b.slice(p+8,p+8+n)),z=s.indexOf('\0');if(s.slice(0,z)==='chara'){var u=Uint8Array.from(atob(s.slice(z+1)),function(c){return c.charCodeAt(0)});return new TextDecoder().decode(u)}}p+=12+n}return ''}
async function impAll(e){var f=e.target.files[0];e.target.value='';if(!f)return;try{var j=JSON.parse(await f.text());if(!j.chats||!j.chars)throw 0;var old=S.provs;delete j.api;(j.provs||[]).forEach(function(p){var o=old.find(function(x){return x.id===p.id});if(o&&!p.key)p.key=o.key});j.wbs=j.wbs||S.wbs;j.wbs.forEach(function(w){if(w.on===undefined)w.on=true});j.chats.forEach(function(c){c.wb=c.wb||[j.wbs[0].id]});Object.assign(S,j);if(!S.provs||!S.provs.length)S.provs=old;if(!P())S.curProv=S.provs[0].id;curWb=S.wbs[0].id;save();render();closeM('m-set');toast('存档已导入')}catch(er){toast('不是有效的存档文件')}}

  $('apname').value=p.name;$('aurl').value=p.url;$('akey').value=p.key;$('amodel').value=p.model;$('atemp').value=p.temp;$('afb').checked=!!S.fb;
}
function saveProv(){var p=P();p.name=$('apname').value.trim()||'未命名';p.url=$('aurl').value.trim();p.key=$('akey').value.trim();p.model=$('amodel').value.trim();p.temp=parseFloat($('atemp').value)||0.85;S.fb=$('afb').checked}
function saveSet(){saveProv();save();render();closeM('m-set');toast('当前接口：'+P().name)}
function delProv(){
  if(S.provs.length<2){toast('至少保留一个接口');return}
  if(confirm('删除接口「'+P().name+'」？')){S.provs=S.provs.filter(function(x){return x.id!==S.curProv});S.curProv=S.provs[0].id;save();loadProv()}
}
function exportAll(){var o=JSON.parse(JSON.stringify(S));o.provs.forEach(function(p){p.key=''});dl(o,'rp_studio_all.json')}
function resetAll(){if(confirm('确认重置所有数据？')){localStorage.removeItem('RPS_V6');location.reload()}}
function dl(o,n){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));a.download=n;a.click()}
function openM(id){
  if(id==='m-char')rChars();
  if(id==='m-world'){loadWb()}
  if(id==='m-mem'){var ch=getCurChat();$('minfo').textContent='活跃消息：'+ch.msgs.filter(function(m){return !m.arch}).length+' 条 | 已归档：'+ch.msgs.filter(function(m){return m.arch}).length+' 条';$('mkeep').value=ch.mem.keep;$('mauto').value=S.autoN||0;$('msum').value=ch.mem.sum}
  if(id==='m-set')loadProv();
  $(id).classList.add('show');
}
function closeM(id){if(id==='m-world'){saveWb();save();toast('世界书已保存')}$(id).classList.remove('show')}

var uin=$('uin');
uin.addEventListener('input',function(){uin.style.height='auto';uin.style.height=Math.min(uin.scrollHeight,100)+'px'});
uin.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(pointer:fine)').matches){e.preventDefault();sendOrStop()}});
$('chat').addEventListener('click',function(e){var b=e.target.closest('.bub');if(b)b.parentNode.classList.toggle('open')});
$('m-world').addEventListener('input',function(){saveWb();save()});$('m-world').addEventListener('change',function(e){saveWb();save();if(e.target.id==='wbon')loadWb()});
$('rs').onclick=function(){var i=(S.provs.indexOf(P())+1)%S.provs.length;S.curProv=S.provs[i].id;save();render();toast('已切换接口：'+P().name)};
render();
</script>
</body>
</html>
